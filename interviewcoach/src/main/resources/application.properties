spring.application.name=interviewcoach
server.port=8080

# AI service URLs
ai.face.url=http://localhost:5001
ai.text.url=http://localhost:8000

# Request/connection timeouts
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.mvc.async.request-timeout=300000
spring.webflux.request-timeout=300000
server.tomcat.connection-timeout=300000
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/interviewcoach
spring.datasource.username=root
spring.datasource.password=Neetesh@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Remove default Spring Security user
# (We will use our own user entity and login logic)
# spring.security.user.name=admin
# spring.security.user.password=admin

# Optional logging for debugging
logging.level.org.springframework.security=INFO
